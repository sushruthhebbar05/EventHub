name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventhub
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: eventhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventhub -d eventhub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://eventhub:ci_password@localhost:5432/eventhub_test
      TEST_DATABASE_URL: postgresql+psycopg2://eventhub:ci_password@localhost:5432/eventhub_test
      JWT_SECRET: ci-only-secret-0123456789-abcdefghijklmnop
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Unit tests
        run: pytest tests/unit -v
      - name: Integration tests (real PostgreSQL, includes the concurrency test)
        run: pytest tests/integration -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
